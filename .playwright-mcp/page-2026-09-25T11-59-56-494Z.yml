        - generic [ref=f156e38]: Backend Engineer
        - paragraph [ref=f156e39]: I build the backend systems that big brands never see, but run underneath their branded platform anyway. I'm a Backend Engineer at IREG - IT in Lahore, working on MyPowerly, a white-label multi-tenant SaaS platform covering e-signatures, IRS tax filing, payments, and WhatsApp automation. My stack is Django, DRF, Celery, Redis, and PostgreSQL, deployed through Apache and Daphne with GitHub Actions CI/CD. I graduated top of my class in Computer Science from UET Mardan (Gold Medalist, 3.8/4.0 GPA).
