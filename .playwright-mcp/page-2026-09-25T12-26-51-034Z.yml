            - paragraph [ref=e27]: Stripe is a technology company focused on improving the conditions for economic growth and prosperity.
            - paragraph [ref=e28]: We build programmable financial infrastructure, rethinking from first principles how financial services should work, to make it easier and cheaper for any business to start and scale.
            - paragraph [ref=e29]:
              - text: More than 5 million
              - link "businesses" [ref=e30] [cursor=pointer]:
                - /url: /customers
              - text: build on Stripe, spanning the economic frontier—from solo founders to established enterprises—united by a practical focus on growth. The most ambitious companies in the world use Stripe as core infrastructure to grow faster. They process trillions of dollars a year on Stripe, equivalent to around 1.7% of global GDP.
            - paragraph [ref=e31]: While economic growth makes everyone better off, open markets also enable greater variety. When any business can easily serve a global customer base, the quality and diversity of products in the world increase, and craft and creativity are unleashed into the smallest niches.
            - paragraph [ref=e32]:
              - text: Our own growth is wholly contingent on the success of the businesses building on Stripe. We therefore invest back into our technology at an unusual rate. We make
              - link "upgrades to our products" [ref=e33] [cursor=pointer]:
                - /url: /roadmap
              - text: every single day to deliver compounding gains to our customers. We maintain some of the most
              - link "reliable APIs" [ref=e34] [cursor=pointer]:
                - /url: https://status.stripe.com/
              - text: on the internet. We build entirely new
              - link "pieces" [ref=e35] [cursor=pointer]:
                - /url: https://tempo.xyz/
              - text: of
              - link "financial" [ref=e36] [cursor=pointer]:
                - /url: https://mpp.dev/
              - link "infrastructure" [ref=e37] [cursor=pointer]:
                - /url: https://joinopenstandard.com/
              - text: to enable new ideas. And our significant advances in
              - link "risk and fraud" [ref=e38] [cursor=pointer]:
                - /url: /radar
              - text: infrastructure over many years are making the internet economy safer and more accessible.
            - paragraph [ref=e39]:
              - text: We recognize that markets work best when they are embedded in hospitable cultures. In addition to building tools for businesses, we also
              - link "publish" [ref=e40] [cursor=pointer]:
                - /url: https://press.stripe.com/
              - link "ideas" [ref=e41] [cursor=pointer]:
                - /url: https://worksinprogress.co/
              - text: that we think are conducive to economic and technological advancement, and make
              - link "unconventional" [ref=e42] [cursor=pointer]:
                - /url: https://frontierclimate.com/
              - link "bets" [ref=e43] [cursor=pointer]:
                - /url: https://www.interceptfund.com/
              - text: that we think will have a long-term impact on growth. In the words of Deirdre McCloskey, economic growth ensues when people possess the freedom to “have a go,” and we think that free exchange and free societies go hand in hand.
